[build-system]
# Floor only. hatchling >=1.32 emits "Metadata-Version: 2.5", which needs twine
# >=7.0.0 to validate - see the twine floor in the dev extra below.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "transparent-tor-proxy"
version = "0.4.7"
description = "Transparent Tor Proxy - route all system traffic through Tor"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "stem>=1.8.0",
    "rich>=15.0.0",
    "transitions>=0.9.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.1.0",
    "mypy>=1.10.0",
    "build>=1.0.0",
    # 7.0.0 is the first release that validates "Metadata-Version: 2.5", which
    # hatchling >=1.32 emits. With an older twine `twine check` fails the release
    # build with "InvalidDistribution: '2.5' is not a valid metadata version".
    "twine>=7.0.0",
    "bump-my-version>=1.4.1",
    "hypothesis>=6.0.0",
    # `make coverage` invokes pytest --cov, so the plugin that provides it is a
    # declared dependency. It was not, and the target therefore failed with
    # "unrecognized arguments" - a gate that could not run.
    "pytest-cov>=5.0.0",
]
nse = [
    # 2.1.0 is the floor, not a preference. Before it, the NSE runner reported
    # PASSED when its oracle observed nothing, and the trace monitor could stop
    # reading mid-run without saying so - which would make TTP's zero-leak suite
    # green against an instrument that was not measuring. The upper bound is a
    # real bound: 2.0.0 already rewrote run_test_pipeline's signature once.
    "network-sandbox-engine>=2.1.0,<3",
    "pyroute2",
]

[project.scripts]
ttp = "ttp.cli:app"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that require root and a real Tor instance",
    "leak: marks tests as offensive leak verification tests",
    "nse: marks tests that require root, NSE, and network namespace privileges",
    "real_binary_lookup: use the real ttp.paths resolver instead of the deterministic test stub",
]
# --strict-markers: a typo in a marker name silently deselects the test it was
# meant to tag, which is how a suite quietly stops running.
addopts = "--ignore=tests/leak -m \"not integration and not nse\" --strict-markers"
filterwarnings = [
    "ignore:setDaemon\\(\\) is deprecated:DeprecationWarning:stem.*"
]

[tool.hatch.build.targets.sdist]
include = [
    "ttp",
    "assets",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    "tests",
    "scripts",
    "packaging",
    "dist",
    "build",
    "*.qcow2",
    "*.iso",
    "*.img",
    "venv",
    ".venv",
    "__pycache__"
]

[tool.hatch.build.targets.wheel]
packages = ["ttp"]

[tool.bumpversion]
current_version = "0.4.7"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "ttp/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "packaging/PKGBUILD"
search = "pkgver={current_version}"
replace = "pkgver={new_version}"

[[tool.bumpversion.files]]
filename = "README.md"
search = "transparent-tor-proxy_{current_version}_all.deb"
replace = "transparent-tor-proxy_{new_version}_all.deb"

[[tool.bumpversion.files]]
filename = "README.md"
search = "transparent-tor-proxy-{current_version}-1"
replace = "transparent-tor-proxy-{new_version}-1"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear (bug-prone patterns)
    "UP",    # pyupgrade (modern Python syntax)
    "SIM",   # flake8-simplify
    "G",     # flake8-logging-format
    "PIE",   # misc lints
    "RUF",   # ruff-specific rules
    "PERF",  # performance anti-patterns
]
ignore = [
    "E501",    # line-too-long (handled by formatter)
    "B008",    # function-call-in-default-argument (typer pattern)
    "B904",    # raise-without-from-inside-except (CLI exit pattern)
    "UP045",   # non-pep604-annotation-optional (wait for type annotation pass)
    "SIM105",  # suppressible-exception (readability tradeoff)
    "SIM117",  # multiple-with-statements (nested with in tests)
    "RUF012",  # mutable-class-default (CLIState is intentional)
    "PERF203", # try-except in loop (zero-cost in Python 3.11+)
    "PERF401", # list-extend-in-loop (readability in string builders)
    "G004",    # logging f-strings (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["ttp"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# stem ships no py.typed marker, so its imports are untyped for mypy.
[[tool.mypy.overrides]]
module = ["stem", "stem.*"]
ignore_missing_imports = true

# transitions.Machine attaches trigger methods (heal_fail, reconnect, ...) and
# `state` to the FSM at runtime, which mypy cannot see statically.
[[tool.mypy.overrides]]
module = "ttp.watchdog.*"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "ttp.firewall.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "ttp.state"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "ttp.tor_config"
disallow_untyped_defs = true

