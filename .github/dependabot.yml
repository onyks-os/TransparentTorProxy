version: 2
updates:
  # Keep GitHub Actions pinned references fresh. Required for a good
  # OpenSSF Scorecard "Pinned-Dependencies" and "Dependency-Update-Tool" score.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    # One PR a month for every action. Grouping everything also keeps the
    # CodeQL init, analyze and upload-sarif actions together: CodeQL refuses
    # to analyze with a different version from the one that initialised
    # ("Loaded a configuration file for version '4.38.2', but running version
    # '4.38.1'"), so one PR per action failed every time (#102, #104).
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - "dependencies"
    # These are compatibility fixtures, not deployment locks. Their runtime
    # pins intentionally match the oldest supported distribution packages.
    # The lock audit still checks every version, including these fixtures.
    exclude-paths:
      - "requirements/oldest.in"
      - "requirements/oldest.txt"
    # Every lock moves in one reviewed PR a month instead of one PR per
    # package (eight in a single week before this). Packages that must move
    # together (pydantic and pydantic-core, wcmatch and bracex) are in the
    # same group by construction. Security updates do not wait for the
    # monthly run: Dependabot opens them as soon as an advisory is published,
    # grouped into one PR of their own.
    groups:
      python-locks:
        applies-to: version-updates
        patterns:
          - "*"
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
