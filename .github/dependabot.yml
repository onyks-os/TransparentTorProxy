version: 2
updates:
  # Keep GitHub Actions pinned references fresh. Required for a good
  # OpenSSF Scorecard "Pinned-Dependencies" and "Dependency-Update-Tool" score.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    # init, analyze and upload-sarif must move together: CodeQL refuses to
    # analyze with a different version from the one that initialised
    # ("Loaded a configuration file for version '4.38.2', but running version
    # '4.38.1'"), so one PR per action failed every time (#102, #104).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    labels:
      - "dependencies"
    # These are compatibility fixtures, not deployment locks. Their runtime
    # pins intentionally match the oldest supported distribution packages.
    # The lock audit still checks every version, including these fixtures.
    exclude-paths:
      - "requirements/oldest.in"
      - "requirements/oldest.txt"
    groups:
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
      wcmatch:
        patterns:
          - "wcmatch"
          - "bracex"
      dev-dependencies:
        dependency-type: "development"
