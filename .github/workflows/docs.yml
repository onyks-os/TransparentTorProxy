name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # mkdocs.yml declares the mkdocstrings plugin, so the build aborts with
      # "The \"mkdocstrings\" plugin is not installed" unless it is present here.
      - name: Install documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material "mkdocstrings[python]"

      # docs/web/release-notes/changelog.md is generated from CHANGELOG.md by
      # `make docs-sync`. Regenerating it and failing on a diff keeps the published
      # release notes from silently drifting behind the root changelog.
      - name: Check the generated release notes are up to date
        run: |
          make docs-sync
          git diff --exit-code docs/web/release-notes/changelog.md \
            || { echo "::error::Run 'make docs-sync' and commit the result."; exit 1; }

      # --strict turns broken links and missing nav entries into build failures,
      # so documentation rot is caught in review rather than after publication.
      - name: Build (strict)
        run: mkdocs build --strict --site-dir ./site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ./site
          retention-days: 7
