name: Documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install documentation toolchain
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs

      # --strict turns broken links and missing nav entries into build failures,
      # so documentation rot is caught in review rather than after publication.
      - name: Build (strict)
        run: mkdocs build --strict --site-dir ./site

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ./site
          retention-days: 7
