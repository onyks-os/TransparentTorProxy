# OpenSSF Scorecard — automated supply-chain posture assessment.
# Results appear in the Security tab and feed the Scorecard badge in README.md.
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '25 4 * * 1'
  push:
    branches: ["main"]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload the SARIF result
      id-token: write          # publish results to the public Scorecard API
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Set to true to publish results at https://api.scorecard.dev — required
          # for the Scorecard badge to render in the README.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
