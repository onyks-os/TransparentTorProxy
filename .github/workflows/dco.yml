# Enforces the Developer Certificate of Origin: every commit in a pull request
# must carry a Signed-off-by line. See CONTRIBUTING.md.
name: DCO

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dco-check:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            # The DCO is a statement by a human that they have the right to submit
            # the contribution. An automated dependency bump asserts no authorship
            # over the third-party code it points at, so requiring a sign-off from
            # the bot blocks the merge queue without establishing anything.
            case "$author" in
              *"[bot]"*) echo "Skipping bot commit $sha ($author)"; continue ;;
            esac
            if ! git show -s --format='%B' "$sha" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $sha is missing 'Signed-off-by: $author'"
              failed=1
            fi
          # --no-merges: GitHub's "Update branch" button merges main into the PR
          # as a commit authored by the contributor but never signed off, so the
          # check failed PRs whose every authored commit was signed. The probot
          # DCO check skips merge commits too. What this gives up is a sign-off
          # on conflict resolutions made inside a merge commit; a PR that needs
          # one can be rebased instead.
          done < <(git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA")
          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Fix with: git rebase --signoff $BASE_SHA && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
