name: Release

on:
  push:
    tags:
      - 'v*'

# Declared per job instead of globally: only `release` needs to write to the repo,
# and each publishing job gets its own OIDC token scoped to its own environment.
permissions:
  contents: read

jobs:
  release:
    name: Build, Sign, and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Create the GitHub Release and upload its assets
      id-token: write   # Sigstore keyless signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Full history so the previous tag can be resolved for the compare link.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm checkpolicy policycoreutils-python-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The tag is the only thing a human types during a release, so it is the
      # only thing that can silently disagree with the tree it points at.
      - name: Verify tag matches the packaged version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg_version"
            exit 1
          fi
          echo "Releasing version $pkg_version"

      - name: Lint and type-check
        run: make lint

      - name: Run unit tests
        run: make test

      # `make packages` (packaging/release.sh) is what populates packaging/ with
      # the .deb, .rpm, .whl, .tar.gz and SHA256SUMS.txt that the sign and publish
      # steps below consume. `make build` only produces the Python sdist/wheel
      # into dist/, which would leave every glob below empty.
      - name: Build release packages
        run: make packages

      # release.sh skips the .rpm when rpmbuild is absent and still exits 0, so a
      # missing build tool would otherwise publish a silently incomplete release.
      - name: Verify all release artifacts were produced
        run: |
          missing=0
          for pattern in 'packaging/*.deb' 'packaging/*.rpm' 'packaging/*.whl' \
                         'packaging/*.tar.gz' 'packaging/SHA256SUMS.txt'; do
            # shellcheck disable=SC2086
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::error::No release artifact matched $pattern"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -la packaging/
        shell: bash

      - name: Generate SBOM
        run: |
          npm install -g @cyclonedx/cdxgen
          cdxgen -o packaging/sbom.json

      - name: Sign packages with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: |
            packaging/*.deb
            packaging/*.rpm
            packaging/*.whl
            packaging/*.tar.gz
            packaging/SHA256SUMS.txt
            packaging/sbom.json

      # The release body is the curated CHANGELOG section, which is how the notes
      # for v0.4.5 and earlier were written. GitHub's generate_release_notes lists
      # merged pull requests instead: on this repository, where work lands as direct
      # commits, that yields two unrelated old PRs and a "New Contributors" line
      # crediting the maintainer as a first-time contributor to their own project.
      - name: Assemble release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          make release-notes VERSION="$version" > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # Previous tag by version order, not by reachability: v0.4.5 points at a
          # commit that history rewriting left outside main, so `git describe`
          # walks past it to v0.4.0 and the link would imply 0.4.5 never shipped.
          prev_tag="$(git tag --list 'v*' --sort=-version:refname \
                       | grep -vFx "${GITHUB_REF_NAME}" | head -n1 || true)"
          {
            echo
            echo "---"
            echo
            if [ -n "$prev_tag" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            fi
            echo "**Verifying these artifacts**: see [docs/verification.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/verification.md)"
          } >> RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            packaging/*.deb
            packaging/*.rpm
            packaging/*.whl
            packaging/*.tar.gz
            packaging/SHA256SUMS.txt
            packaging/*.sigstore*
            packaging/sbom.json
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

      # Hand the *signed* wheel and sdist to the publishing jobs. They must upload
      # these exact bytes: rebuilding downstream would put a different artifact on
      # PyPI than the one the Sigstore bundle attests to, under the same version.
      # Only the Python distributions go in - never the .deb/.rpm/.sigstore files.
      - name: Stage Python distributions for publication
        run: |
          mkdir -p dist_publish
          cp packaging/*.whl packaging/*.tar.gz dist_publish/
          ls -la dist_publish/

      - name: Upload distributions as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist_publish/
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Publication. TestPyPI first, and PyPI only after an installed smoke test of
  # what actually landed there - so a broken distribution is caught on the index
  # nobody depends on, not the one everybody does.
  # ---------------------------------------------------------------------------

  publish-testpypi:
    name: Publish to TestPyPI
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/transparent-tor-proxy
    permissions:
      id-token: write   # Trusted Publishing: mints a short-lived OIDC token, no stored secret

    steps:
      - name: Download the distributions built by the release job
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A re-run of an already-published tag should be a no-op here rather
          # than a hard failure; TestPyPI is a rehearsal surface.
          skip-existing: true

  verify-testpypi:
    name: Install from TestPyPI and smoke test
    needs: publish-testpypi
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The index takes a little while to serve a freshly uploaded file, so poll
      # rather than sleeping for a guessed interval.
      - name: Install the published version from TestPyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "Waiting for transparent-tor-proxy==$version to appear on TestPyPI..."
          for attempt in $(seq 1 20); do
            if pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "transparent-tor-proxy==$version"; then
              echo "Installed on attempt $attempt."
              exit 0
            fi
            echo "Not available yet (attempt $attempt/20), retrying in 15s..."
            sleep 15
          done
          echo "::error::transparent-tor-proxy==$version never became installable from TestPyPI"
          exit 1

      # Proves the distribution is not merely uploaded but usable: the console
      # script resolves, the package imports, and the version matches the tag.
      - name: Smoke test the installed package
        run: |
          version="${GITHUB_REF_NAME#v}"
          ttp --help > /dev/null
          installed="$(python -c 'import ttp; print(ttp.__version__)')"
          echo "Installed version: $installed"
          if [ "$installed" != "$version" ]; then
            echo "::error::Installed version $installed does not match tag $version"
            exit 1
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/transparent-tor-proxy
    permissions:
      id-token: write

    steps:
      - name: Download the distributions built by the release job
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No skip-existing here on purpose: a version that already exists on PyPI
        # means something is wrong with the release, and must fail loudly.
