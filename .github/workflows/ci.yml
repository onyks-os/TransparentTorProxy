name: TTP CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      # The full dev extra, not just ruff: `make lint` also runs mypy, which needs
      # typer/rich/transitions importable to resolve their types.
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Delegate to the Makefile rather than restating the steps here. This job
      # previously reimplemented ruff by hand and drifted: mypy was part of
      # `make lint` but was never run in CI.
      - name: Run linters and type checks
        run: make lint

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: make test

  integration-debian:
    name: Integration Tests (Debian)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Debian integration tests
        run: make integration-debian
