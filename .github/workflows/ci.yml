name: TTP CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      # The full dev extra, not just ruff: `make lint` also runs mypy, which needs
      # typer/rich/transitions importable to resolve their types.
      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # `make lint` runs ShellCheck and markdownlint when they are on PATH and
      # prints "skipping" when they are not. On a bare runner they were never
      # installed, so two of the four linters in the gate quietly did nothing.
      - name: Install ShellCheck and markdownlint
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          npm install -g markdownlint-cli

      - name: Assert every linter is actually present
        run: |
          command -v shellcheck
          command -v markdownlint

      # Delegate to the Makefile rather than restating the steps here. This job
      # previously reimplemented ruff by hand and drifted: mypy was part of
      # `make lint` but was never run in CI.
      - name: Run linters and type checks
        run: make lint

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: make test

      # The coverage floor lives in the Makefile, so `make coverage` locally and
      # this job cannot disagree about what "covered enough" means. Running it
      # on one interpreter is enough: the number does not vary by version.
      - name: Enforce the coverage ratchet
        if: matrix.python-version == '3.12'
        run: make coverage

  # The floors in pyproject.toml are the versions Ubuntu 24.04 ships, and the
  # native packages run on whatever the distribution has. The job above always
  # installs the newest releases, so without this one a floor is a claim nobody
  # has tested: rich>=15 went in that way, and made the .rpm uninstallable.
  unit-tests-oldest:
    name: Unit Tests (oldest supported dependencies)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the oldest supported runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packaging/oldest-supported.pins pytest hypothesis "cyclonedx-python-lib[json-validation]"
          pip install --no-deps -e .
          pip list

      - name: Run unit tests
        run: python -m pytest -q

  # Two independent builds of the same commit must be identical, byte for byte.
  # A Sigstore signature proves the release workflow built an artifact; only a
  # reproducible build lets anyone check it built what the source says. This
  # found a real defect the day it was added: unanchored sdist patterns were
  # packing LICENSE files from the build venv, and two stray docs files.
  reproducible-build:
    name: Reproducible build (two builds, byte for byte)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build twice and compare
        run: scripts/check-reproducible.sh "$RUNNER_TEMP/repro"

      - name: Digests
        if: always()
        run: sha256sum "$RUNNER_TEMP"/repro/1/* || true

  # Three distributions, because TTP branches on which one it is running on and
  # only one of those branches was ever executed. `is_fedora_family()` changes
  # the Tor account it looks for (debian-tor / toranon / tor), the service name,
  # and whether the SELinux path is considered at all; the packaging targets
  # differ; and the nftables each distro ships is a different version compiling
  # the same ruleset. A suite that runs on Debian alone measures one of them.
  #
  # `label` exists so the check names stay exactly as they were - branch
  # protection matches them as strings, and "Integration Tests (Debian)" is an
  # existing required check.
  #
  # fail-fast is off deliberately: one distribution breaking must not hide
  # whether the other two passed, which is the whole reason for running three.
  integration:
    name: Integration Tests (${{ matrix.label }})
    needs: unit-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            label: Debian
          - distro: fedora
            label: Fedora
          - distro: arch
            label: Arch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run ${{ matrix.label }} integration tests
        run: make integration-${{ matrix.distro }}

  zero-leak:
    # The suite behind the README's strongest claim. Until now it ran nowhere:
    # no make target, no CI job, no step in verify.sh, and the `nse` marker is
    # excluded from the default pytest run. A claim nothing executes is not a
    # measurement.
    #
    # Requires network-sandbox-engine >= 2.1.2. Below 2.1.0, the engine could
    # report a clean result from an oracle that observed nothing, so a green run
    # here would prove nothing about the firewall; below 2.1.2, its capture
    # filter hid routable ICMPv6. tests/test_nse_rules.py
    # refuses to run against an older NSE rather than producing a false pass.
    name: Zero-leak ruleset verification (NSE)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      # libpcap is not optional here: the sniffer compiles a BPF filter, and
      # without it Scapy raises "Cannot set filter" at construction time. The
      # suite then fails loudly - including its own positive control - which is
      # the intended behaviour, but the fix is to install the library.
      # libpcap-dev as well as the runtime package: Scapy dlopen()s the
      # unversioned "libpcap.so", and only the -dev package ships that symlink.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2 conntrack libpcap0.8 libpcap-dev

      - name: Record the environment under test
        run: |
          uname -r
          nft --version
          ip -V

      - name: Install TTP with the NSE extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,nse]"

      # TTP_REQUIRE_NSE=1 turns a missing, shadowed or too-old NSE into a hard
      # error instead of a skip. Without it this job could pass by running
      # nothing at all, which is the failure mode the whole suite exists to
      # rule out.
      - name: Verify zero cleartext escapes
        run: |
          sudo -E env "PATH=$PATH" TTP_REQUIRE_NSE=1 \
            python -m pytest tests/test_nse_rules.py -m nse -v

  release-rehearsal:
    # `make packages` is what the release workflow runs to produce the .deb,
    # .rpm, wheel and sdist it then signs and publishes. Two release blockers -
    # the `make build` target drift and an unpinned build backend emitting
    # metadata twine rejects - were invisible until that pipeline was run end to
    # end on a clean tree, i.e. at tag time, after the tag existed.
    #
    # This job runs it on every push instead, so the next such breakage is a red
    # CI run rather than a failed release.
    name: Release rehearsal (make packages)
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm checkpolicy policycoreutils-python-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build every release artifact
        run: make packages

      # release.sh skips the .rpm when rpmbuild is absent and still exits 0, so
      # a missing build tool would otherwise produce a silently incomplete
      # release. Same assertion the release workflow makes, run earlier.
      - name: Verify all release artifacts were produced
        run: |
          missing=0
          for pattern in 'packaging/*.deb' 'packaging/*.rpm' 'packaging/*.whl' \
                         'packaging/*.tar.gz' 'packaging/SHA256SUMS.txt' \
                         'packaging/*.deb.cdx.json' 'packaging/*.rpm.cdx.json' \
                         'packaging/*.whl.cdx.json' 'packaging/*.tar.gz.cdx.json'; do
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::error::No release artifact matched $pattern"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          ls -la packaging/
        shell: bash

      - name: Check the distributions are publishable
        run: |
          pip install --upgrade twine
          twine check packaging/*.whl packaging/*.tar.gz

      # Each SBOM must be valid CycloneDX, not merely present: a malformed one
      # would be signed and published all the same.
      - name: Validate the SBOMs against the CycloneDX schema
        run: python packaging/validate_sbom.py packaging/*.cdx.json

      # Building a package proves nothing about installing it. These install
      # each one in a clean container of the distribution it targets and check
      # that the CLI runs, the watchdog can be built and teardown imports - the
      # three things the 0.4.8 packages got wrong between them.
      - name: Install the .deb on Debian 13
        run: packaging/smoke_test.sh packaging/*.deb docker.io/library/debian:13

      - name: Install the .deb on Ubuntu 24.04
        run: packaging/smoke_test.sh packaging/*.deb docker.io/library/ubuntu:24.04

      - name: Install the .rpm on Fedora 44
        run: packaging/smoke_test.sh packaging/*.rpm registry.fedoraproject.org/fedora:44

      - name: Build and install the PKGBUILD on Arch
        run: packaging/smoke_test.sh arch
