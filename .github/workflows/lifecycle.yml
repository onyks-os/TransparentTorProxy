# Lifecycle transitions (#30): shutdown, reboot and suspend/resume with an
# active session, and the watchdog chaos sweep, in QEMU VMs on hosted runners.
#
# These could not run in CI before because `ttp start` routes its whole host
# through Tor, and on a runner that includes the runner's own connection to
# GitHub. Inside a VM the host TTP takes over is the guest; the runner keeps
# its network. QEMU's user networking needs no root, and its filter-dump
# records the guest's traffic outside the guest, below TTP's own firewall.
#
# Not on every PR: a run takes around a quarter of an hour. It runs when the
# code that decides these transitions changes, weekly, and on demand.
name: Lifecycle (VM)

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/vm/lifecycle/**"
      - ".github/workflows/lifecycle.yml"
      - "ttp/firewall/**"
      - "ttp/commands/**"
      - "ttp/dns.py"
      - "ttp/dns_resolved.py"
      - "ttp/watchdog/**"
      - "tests/chaos_monkey.py"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Two guests, because they bring the network up differently: Debian's cloud
  # image with systemd-networkd, Fedora's with NetworkManager. Shutdown ordering
  # is where that can matter (#85).
  lifecycle:
    name: Lifecycle transitions (VM, ${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Hosted Linux runners expose /dev/kvm but only to root by default.
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage

      - name: Run the lifecycle scenarios
        env:
          VM_WORK: ${{ runner.temp }}/vm
          VM_DISTRO: ${{ matrix.distro }}
        run: scripts/vm/lifecycle/run.sh

      - name: Upload captures, state and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lifecycle-vm-${{ matrix.distro }}
          path: |
            ${{ runner.temp }}/vm/*.pcap
            ${{ runner.temp }}/vm/*.txt
            ${{ runner.temp }}/vm/*.log
          if-no-files-found: warn

  # Three sweeps, because each answers a different question:
  #  - chained: one session takes every fault in turn, so later faults meet
  #    what earlier ones left (this is the order that found #77);
  #  - independent: every fault meets a fresh, healthy session;
  #  - independent, no bypass: no canary either, because its bypass rule is
  #    something the watchdog checks - with it configured, a flushed table was
  #    caught for a reason a normal session does not have (#80).
  chaos:
    name: Watchdog chaos sweep (VM, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: chained
            args: ""
          - variant: independent
            args: "--reset-between --duration 2400"
          - variant: independent-no-bypass
            args: "--reset-between --no-bypass --duration 2400"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage

      - name: Run the chaos sweep in the guest
        env:
          VM_WORK: ${{ runner.temp }}/vm
          CHAOS_ARGS: ${{ matrix.args }}
        run: scripts/vm/lifecycle/chaos.sh

      - name: Upload the sweep's log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: chaos-vm-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/vm/chaos.log
            ${{ runner.temp }}/vm/*.log
          if-no-files-found: warn
