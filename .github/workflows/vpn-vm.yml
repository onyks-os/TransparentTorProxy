# Real Internet Tor-over-VPN, with an observer outside the protected guest.
name: Required VPN (VM)

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/vpn-vm.yml"
      - "scripts/vm/vpn/**"
      - "ttp/vpn.py"
      - "ttp/vpn_guard.py"
      - "ttp/firewall/**"
      - "ttp/watchdog/**"
      - "ttp/commands/**"
      - "ttp/dns*.py"
      - "ttp/tor_service.py"
      - "ttp/tor_config.py"
      - "ttp/virtual_addresses.py"
      - "ttp/apparmor.py"
      - "ttp/ttp-tor.apparmor"
      - "ttp/session_safety.py"
  schedule:
    - cron: "43 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required-vpn:
    name: Real Tor through required WireGuard (Debian VM, ${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # One job per release gate in docs/web/how-to/vpn.md. Every topology
      # keeps the external observer, positive controls and fault scenarios.
      matrix:
        include:
          - { name: "v4-v4", args: "--topology v4-v4", timeout: 40 }
          - { name: "v4-dual", args: "--topology v4-dual", timeout: 40 }
          - { name: "v6-v4", args: "--topology v6-v4", timeout: 40 }
          - { name: "v6-dual", args: "--topology v6-dual", timeout: 40 }
          - { name: "dual-v4", args: "--topology dual-v4", timeout: 40 }
          - { name: "dual-dual", args: "--topology dual-dual", timeout: 40 }
          - { name: "obfs4-bridge", args: "--topology v4-v4 --bridge", timeout: 50 }
          - { name: "suspend-reboot", args: "--topology v4-v4 --transitions", timeout: 70 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install VM tools and fetch Debian cloud image
        env:
          BASE: ${{ runner.temp }}/vpn-base
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage
          mkdir -p "$BASE"
          curl --retry 3 --retry-delay 2 -fsSL https://cloud.debian.org/images/cloud/trixie/20261103-2651/SHA512SUMS -o "$BASE/SHA512SUMS"
          curl --retry 3 --retry-delay 2 -fsSL https://cloud.debian.org/images/cloud/trixie/20261103-2651/debian-13-genericcloud-amd64-20261103-2651.qcow2 \
            -o "$BASE/debian-13-genericcloud-amd64-20261103-2651.qcow2"

      - name: Run public Tor, DNS, DHCP and failure scenarios
        env:
          SCENARIO: ${{ matrix.args }}
        run: |
          # SCENARIO comes from the fixed matrix above, never from event input.
          # shellcheck disable=SC2086
          python3 scripts/vm/vpn/run.py \
            --base "${{ runner.temp }}/vpn-base/debian-13-genericcloud-amd64-20261103-2651.qcow2" \
            --checksums "${{ runner.temp }}/vpn-base/SHA512SUMS" \
            --work "${{ runner.temp }}/vpn-run" $SCENARIO

      - name: Upload reports and external captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: required-vpn-debian-vm-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/vpn-run/results.json
            ${{ runner.temp }}/vpn-run/*/*.pcap
            ${{ runner.temp }}/vpn-run/*/*.txt
            ${{ runner.temp }}/vpn-run/*/*.log
          if-no-files-found: warn
