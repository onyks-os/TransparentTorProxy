name: 🐛 Bug report
description: Report something that does not work as documented
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **Do not use this form for security vulnerabilities.** Report those privately through
        [GitHub Security Advisories](https://github.com/onyks-os/TransparentTorProxy/security/advisories/new).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest released version.
          required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "v0.4.7"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, distribution, and Python version.
      placeholder: "Fedora 43, Python 3.10"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The minimal sequence that triggers the bug.
      placeholder: |
        1. Run `...`
        2. Observe `...`
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and output
      description: Full output of the failing command. This is automatically formatted as code.
      render: shell
